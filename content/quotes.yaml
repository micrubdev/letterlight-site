# Every quote must appear word for word in its public-domain source_url (checked by tools/verify-quote.js).
- id: seneca-imagination
  mentor: seneca
  text: "There are more things, Lucilius, likely to frighten us than there are to crush us; we suffer more often in imagination than in reality."
  work: Moral Letters to Lucilius
  location: Letter 13
  translation: Richard Mott Gummere (1917)
  source_url: https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_13
  verified: 2026-11-19
- id: marcus-obstacle-road
  mentor: marcus-aurelius
  text: "the mind converts and changes every hindrance to its activity into an aid; and so that which is a hindrance is made a furtherance to an act; and that which is an obstacle on the road helps us on this road."
  work: Meditations
  location: Book V, 20
  translation: George Long (1862)
  source_url: https://en.wikisource.org/wiki/The_Thoughts_of_the_Emperor_Marcus_Aurelius_Antoninus/Book_V
  verified: 2026-11-19
- id: epictetus-returned
  mentor: epictetus
  text: 'Never say of anything, "I have lost it"; but, "I have returned it."'
  work: The Enchiridion
  location: Chapter 11
  translation: Elizabeth Carter (1758)
  source_url: https://classics.mit.edu/Epictetus/epicench.html
  verified: 2026-11-19
- id: seneca-weep-not-wail
  mentor: seneca
  text: "Let not the eyes be dry when we have lost a friend, nor let them overflow. We may weep, but we must not wail."
  work: Moral Letters to Lucilius
  location: Letter 63
  translation: Richard Mott Gummere (1917)
  source_url: https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_63
  verified: 2026-11-19
- id: rumi-reed-flute
  mentor: rumi
  text: "Hearken to the reed-flute, how it complains, Lamenting its banishment from its home"
  work: The Masnavi
  location: Book I, Prologue
  translation: Edward Henry Whinfield (1887)
  source_url: https://en.wikisource.org/wiki/Masnavi_I_Ma'navi/Book_I
  verified: 2026-11-19
- id: tolstoy-live-by-love
  mentor: tolstoy
  text: "I have learnt that all men live not by care for themselves but by love."
  work: What Men Live By
  location: the closing chapter
  translation: Louise and Aylmer Maude (1906)
  source_url: https://en.wikisource.org/wiki/Twenty-three_Tales/What_Men_Live_By
  verified: 2026-11-19
- id: marcus-future-things
  mentor: marcus-aurelius
  text: "Let not future things disturb thee, for thou wilt come to them, if it shall be necessary, having with thee the same reason which now thou usest for present things."
  work: Meditations
  location: Book VII, 8
  translation: George Long (1862)
  source_url: https://en.wikisource.org/wiki/The_Thoughts_of_the_Emperor_Marcus_Aurelius_Antoninus/Book_VII
  verified: 2026-11-19
- id: laotzu-muddy-water
  mentor: lao-tzu
  text: "Who can (make) the muddy water (clear)? Let it be still, and it will gradually become clear."
  work: Tao Te Ching
  location: Chapter 15
  translation: James Legge (1891)
  source_url: https://en.wikisource.org/wiki/Tâo_Teh_King
  verified: 2026-11-19
