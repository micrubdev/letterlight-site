# Every quote must appear word for word in its public-domain source_url (checked by tools/verify-quote.js).
- id: seneca-imagination
  mentor: seneca
  text: "There are more things, Lucilius, likely to frighten us than there are to crush us; we suffer more often in imagination than in reality."
  work: Moral Letters to Lucilius
  location: Letter 13
  translation: Richard Mott Gummere (1917)
  source_url: https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_13
  verified: 2026-11-19
- id: marcus-obstacle-road
  mentor: marcus-aurelius
  text: "the mind converts and changes every hindrance to its activity into an aid; and so that which is a hindrance is made a furtherance to an act; and that which is an obstacle on the road helps us on this road."
  work: Meditations
  location: Book V, 20
  translation: George Long (1862)
  source_url: https://en.wikisource.org/wiki/The_Thoughts_of_the_Emperor_Marcus_Aurelius_Antoninus/Book_V
  verified: 2026-11-19
- id: epictetus-returned
  mentor: epictetus
  text: 'Never say of anything, "I have lost it"; but, "I have returned it."'
  work: The Enchiridion
  location: Chapter 11
  translation: Elizabeth Carter (1758)
  source_url: https://classics.mit.edu/Epictetus/epicench.html
  verified: 2026-11-19
- id: seneca-weep-not-wail
  mentor: seneca
  text: "Let not the eyes be dry when we have lost a friend, nor let them overflow. We may weep, but we must not wail."
  work: Moral Letters to Lucilius
  location: Letter 63
  translation: Richard Mott Gummere (1917)
  source_url: https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_63
  verified: 2026-11-19
- id: rumi-reed-flute
  mentor: rumi
  text: "Hearken to the reed-flute, how it complains, Lamenting its banishment from its home"
  work: The Masnavi
  location: Book I, Prologue
  translation: Edward Henry Whinfield (1887)
  source_url: https://en.wikisource.org/wiki/Masnavi_I_Ma'navi/Book_I
  verified: 2026-11-19
- id: tolstoy-live-by-love
  mentor: tolstoy
  text: "I have learnt that all men live not by care for themselves but by love."
  work: What Men Live By
  location: the closing chapter
  translation: Louise and Aylmer Maude (1906)
  source_url: https://en.wikisource.org/wiki/Twenty-three_Tales/What_Men_Live_By
  verified: 2026-11-19
- id: marcus-future-things
  mentor: marcus-aurelius
  text: "Let not future things disturb thee, for thou wilt come to them, if it shall be necessary, having with thee the same reason which now thou usest for present things."
  work: Meditations
  location: Book VII, 8
  translation: George Long (1862)
  source_url: https://en.wikisource.org/wiki/The_Thoughts_of_the_Emperor_Marcus_Aurelius_Antoninus/Book_VII
  verified: 2026-11-19
- id: laotzu-muddy-water
  mentor: lao-tzu
  text: "Who can (make) the muddy water (clear)? Let it be still, and it will gradually become clear."
  work: Tao Te Ching
  location: Chapter 15
  translation: James Legge (1891)
  source_url: https://en.wikisource.org/wiki/Tâo_Teh_King
  verified: 2026-11-19
- id: buddha-result-of-thought
  mentor: buddha
  text: "All that we are is the result of what we have thought: it is founded on our thoughts, it is made up of our thoughts."
  work: The Dhammapada
  location: Verse 1
  translation: F. Max Müller (1881)
  source_url: https://en.wikisource.org/wiki/Dhammapada_(Muller)
  verified: 2026-11-19
- id: thoreau-companionable-solitude
  mentor: thoreau
  text: "I never found the companion that was so companionable as solitude."
  work: Walden
  location: Chapter V, "Solitude"
  translation: null
  source_url: https://en.wikisource.org/wiki/Walden_(1893)_Thoreau/Chapter_V
  verified: 2026-11-19
- id: emerson-midst-of-crowd
  mentor: emerson
  text: "It is easy in the world to live after the world's opinion; it is easy in solitude to live after our own; but the great man is he who in the midst of the crowd keeps with perfect sweetness the independence of solitude."
  work: Self-Reliance
  location: Essays, First Series (1841)
  translation: null
  source_url: https://en.wikisource.org/wiki/Essays:_First_Series/Self-Reliance
  verified: 2026-11-19
- id: chekhov-both-ends-of-chain
  mentor: chekhov
  text: "And it seemed to him that he had just seen both ends of that chain; that when he touched one end the other quivered."
  work: The Student
  location: The Tales of Chekhov, Volume 6
  translation: Constance Garnett (1918)
  source_url: https://en.wikisource.org/wiki/The_Tales_of_Chekhov/Volume_6/The_Student
  verified: 2026-11-19
- id: seneca-burdens-of-the-mind
  mentor: seneca
  text: "You must lay aside the burdens of the mind; until you do this, no place will satisfy you."
  work: Moral Letters to Lucilius
  location: Letter 28
  translation: Richard Mott Gummere (1917)
  source_url: https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_28
  verified: 2026-11-20
- id: laotzu-vessel-unfilled
  mentor: lao-tzu
  text: "It is better to leave a vessel unfilled, than to attempt to carry it when it is full."
  work: Tao Te Ching
  location: Chapter 9
  translation: James Legge (1891)
  source_url: https://en.wikisource.org/wiki/Tâo_Teh_King
  verified: 2026-11-20
- id: rumi-garden-of-love
  mentor: rumi
  text: "The fertile garden of love, as it is boundless, Contains other fruits besides joy and sorrow."
  work: The Masnavi
  location: Book I
  translation: Edward Henry Whinfield (1887)
  source_url: https://en.wikisource.org/wiki/Masnavi_I_Ma'navi/Book_I
  verified: 2026-11-20
- id: dostoevsky-moment-of-happiness
  mentor: dostoevsky
  text: "My God, a whole moment of happiness! Is that too little for the whole of a man's life?"
  work: White Nights
  location: "Morning"
  translation: Constance Garnett (1918)
  source_url: https://en.wikisource.org/wiki/White_Nights_and_Other_Stories/White_Nights/Morning
  verified: 2026-11-20
