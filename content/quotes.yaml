# Every quote must appear word for word in its public-domain source_url (checked by tools/verify-quote.js).
- id: seneca-imagination
  mentor: seneca
  text: "There are more things, Lucilius, likely to frighten us than there are to crush us; we suffer more often in imagination than in reality."
  work: Moral Letters to Lucilius
  location: Letter 13
  translation: Richard Mott Gummere (1917)
  source_url: https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_13
  verified: 2026-11-19
- id: marcus-obstacle-road
  mentor: marcus-aurelius
  text: "the mind converts and changes every hindrance to its activity into an aid; and so that which is a hindrance is made a furtherance to an act; and that which is an obstacle on the road helps us on this road."
  work: Meditations
  location: Book V, 20
  translation: George Long (1862)
  source_url: https://en.wikisource.org/wiki/The_Thoughts_of_the_Emperor_Marcus_Aurelius_Antoninus/Book_V
  verified: 2026-11-19
- id: epictetus-returned
  mentor: epictetus
  text: 'Never say of anything, "I have lost it"; but, "I have returned it."'
  work: The Enchiridion
  location: Chapter 11
  translation: Elizabeth Carter (1758)
  source_url: https://classics.mit.edu/Epictetus/epicench.html
  verified: 2026-11-19
- id: seneca-weep-not-wail
  mentor: seneca
  text: "Let not the eyes be dry when we have lost a friend, nor let them overflow. We may weep, but we must not wail."
  work: Moral Letters to Lucilius
  location: Letter 63
  translation: Richard Mott Gummere (1917)
  source_url: https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_63
  verified: 2026-11-19
- id: rumi-reed-flute
  mentor: rumi
  text: "Hearken to the reed-flute, how it complains, Lamenting its banishment from its home"
  work: The Masnavi
  location: Book I, Prologue
  translation: Edward Henry Whinfield (1887)
  source_url: https://en.wikisource.org/wiki/Masnavi_I_Ma'navi/Book_I
  verified: 2026-11-19
- id: tolstoy-live-by-love
  mentor: tolstoy
  text: "I have learnt that all men live not by care for themselves but by love."
  work: What Men Live By
  location: the closing chapter
  translation: Louise and Aylmer Maude (1906)
  source_url: https://en.wikisource.org/wiki/Twenty-three_Tales/What_Men_Live_By
  verified: 2026-11-19
- id: marcus-future-things
  mentor: marcus-aurelius
  text: "Let not future things disturb thee, for thou wilt come to them, if it shall be necessary, having with thee the same reason which now thou usest for present things."
  work: Meditations
  location: Book VII, 8
  translation: George Long (1862)
  source_url: https://en.wikisource.org/wiki/The_Thoughts_of_the_Emperor_Marcus_Aurelius_Antoninus/Book_VII
  verified: 2026-11-19
- id: laotzu-muddy-water
  mentor: lao-tzu
  text: "Who can (make) the muddy water (clear)? Let it be still, and it will gradually become clear."
  work: Tao Te Ching
  location: Chapter 15
  translation: James Legge (1891)
  source_url: https://en.wikisource.org/wiki/Tâo_Teh_King
  verified: 2026-11-19
- id: buddha-result-of-thought
  mentor: buddha
  text: "All that we are is the result of what we have thought: it is founded on our thoughts, it is made up of our thoughts."
  work: The Dhammapada
  location: Verse 1
  translation: F. Max Müller (1881)
  source_url: https://en.wikisource.org/wiki/Dhammapada_(Muller)
  verified: 2026-11-19
- id: thoreau-companionable-solitude
  mentor: thoreau
  text: "I never found the companion that was so companionable as solitude."
  work: Walden
  location: Chapter V, "Solitude"
  translation: null
  source_url: https://en.wikisource.org/wiki/Walden_(1893)_Thoreau/Chapter_V
  verified: 2026-11-19
- id: emerson-midst-of-crowd
  mentor: emerson
  text: "It is easy in the world to live after the world's opinion; it is easy in solitude to live after our own; but the great man is he who in the midst of the crowd keeps with perfect sweetness the independence of solitude."
  work: Self-Reliance
  location: Essays, First Series (1841)
  translation: null
  source_url: https://en.wikisource.org/wiki/Essays:_First_Series/Self-Reliance
  verified: 2026-11-19
- id: chekhov-both-ends-of-chain
  mentor: chekhov
  text: "And it seemed to him that he had just seen both ends of that chain; that when he touched one end the other quivered."
  work: The Student
  location: The Tales of Chekhov, Volume 6
  translation: Constance Garnett (1918)
  source_url: https://en.wikisource.org/wiki/The_Tales_of_Chekhov/Volume_6/The_Student
  verified: 2026-11-19
- id: seneca-burdens-of-the-mind
  mentor: seneca
  text: "You must lay aside the burdens of the mind; until you do this, no place will satisfy you."
  work: Moral Letters to Lucilius
  location: Letter 28
  translation: Richard Mott Gummere (1917)
  source_url: https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_28
  verified: 2026-11-20
- id: laotzu-vessel-unfilled
  mentor: lao-tzu
  text: "It is better to leave a vessel unfilled, than to attempt to carry it when it is full."
  work: Tao Te Ching
  location: Chapter 9
  translation: James Legge (1891)
  source_url: https://en.wikisource.org/wiki/Tâo_Teh_King
  verified: 2026-11-20
- id: rumi-garden-of-love
  mentor: rumi
  text: "The fertile garden of love, as it is boundless, Contains other fruits besides joy and sorrow."
  work: The Masnavi
  location: Book I
  translation: Edward Henry Whinfield (1887)
  source_url: https://en.wikisource.org/wiki/Masnavi_I_Ma'navi/Book_I
  verified: 2026-11-20
- id: dostoevsky-moment-of-happiness
  mentor: dostoevsky
  text: "My God, a whole moment of happiness! Is that too little for the whole of a man's life?"
  work: White Nights
  location: "Morning"
  translation: Constance Garnett (1918)
  source_url: https://en.wikisource.org/wiki/White_Nights_and_Other_Stories/White_Nights/Morning
  verified: 2026-11-20
- id: seneca-while-we-postpone
  mentor: seneca
  text: "Lay hold of to-day's task, and you will not need to depend so much upon to-morrow's. While we are postponing, life speeds by."
  work: Moral Letters to Lucilius
  location: Letter 1
  translation: Richard Mott Gummere (1917)
  source_url: https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_1
  verified: 2026-11-21
- id: marcus-rising-to-work
  mentor: marcus-aurelius
  text: "Why then am I dissatisfied if I am going to do the things for which I exist and for which I was brought into the world? Or have I been made for this, to lie in the bed-clothes and keep myself warm?"
  work: Meditations
  location: Book V, 1
  translation: George Long (1862)
  source_url: https://en.wikisource.org/wiki/The_Thoughts_of_the_Emperor_Marcus_Aurelius_Antoninus/Book_V
  verified: 2026-11-21
- id: epictetus-preferred-before-you
  mentor: epictetus
  text: "Is anyone preferred before you at an entertainment, or in a compliment, or in being admitted to a consultation? If these things are good, you ought to be glad that he has gotten them; and if they are evil, don't be grieved that you have not gotten them."
  work: The Enchiridion
  location: Chapter 25
  translation: Elizabeth Carter (1758)
  source_url: https://classics.mit.edu/Epictetus/epicench.html
  verified: 2026-11-21
- id: confucius-men-of-worth
  mentor: confucius
  text: "When we see men of worth, we should think of equalling them; when we see men of a contrary character, we should turn inwards and examine ourselves."
  work: The Analects
  location: Book IV, Chapter 17
  translation: James Legge (1861)
  source_url: https://en.wikisource.org/wiki/The_Chinese_Classics/Volume_1/Confucian_Analects/IV
  verified: 2026-11-21
- id: socrates-fear-of-death
  mentor: socrates
  text: "For the fear of death is indeed the pretence of wisdom, and not real wisdom, being a pretence of knowing the unknown"
  work: Plato, Apology
  location: 29a
  translation: Benjamin Jowett (1871)
  source_url: https://en.wikisource.org/wiki/Apology_(Jowett)
  verified: 2026-11-21
- id: tolstoy-in-place-of-death
  mentor: tolstoy
  text: "There was no fear because there was no death. In place of death there was light."
  work: The Death of Ivan Ilych
  location: Chapter XII
  translation: Louise and Aylmer Maude
  source_url: https://en.wikisource.org/wiki/The_Death_of_Ivan_Ilych/XII
  verified: 2026-11-21
- id: seneca-remedy-for-anger
  mentor: seneca
  text: "The greatest remedy for anger is delay"
  work: Of Anger
  location: Book II, chapter 29
  translation: Aubrey Stewart (1900)
  source_url: https://en.wikisource.org/wiki/Of_Anger/Book_II
  verified: 2026-11-21
- id: buddha-overcome-anger-by-love
  mentor: buddha
  text: "Let a man overcome anger by love, let him overcome evil by good"
  work: The Dhammapada
  location: Verse 223
  translation: F. Max Müller (1881)
  source_url: https://en.wikisource.org/wiki/Dhammapada_(Muller)
  verified: 2026-11-21
- id: thoreau-direction-of-dreams
  mentor: thoreau
  text: "if one advances confidently in the direction of his dreams, and endeavors to live the life which he has imagined, he will meet with a success unexpected in common hours."
  work: Walden
  location: Conclusion
  translation: null
  source_url: https://en.wikisource.org/wiki/Walden_(1893)_Thoreau/Chapter_XVIII
  verified: 2026-11-21
- id: hillel-if-not-now
  mentor: hillel
  text: "If I am not for myself, who is for me? And if I am for myself alone, what then am I? And if not now, then when?"
  work: Pirkei Avot (Ethics of the Fathers)
  location: Chapter 1, 14
  translation: Wilhelm Bacher, Encyclopædia Britannica (1911)
  source_url: https://en.wikisource.org/wiki/1911_Encyclop%C3%A6dia_Britannica/Hillel
  verified: 2026-11-22
- id: confucius-years-of-parents
  mentor: confucius
  text: "The years of parents may by no means not be kept in the memory, as an occasion at once for joy and for fear."
  work: The Analects
  location: Book IV, chapter 21
  translation: James Legge (1861)
  source_url: https://en.wikisource.org/wiki/The_Chinese_Classics/Volume_1/Confucian_Analects/IV
  verified: 2026-11-22
- id: maimonides-mean-between-extremes
  mentor: maimonides
  text: "maintaining the mean between two equally bad extremes, the too much and the too little"
  work: Eight Chapters on Ethics
  location: Chapter IV
  translation: Joseph I. Gorfinkle (1912)
  source_url: https://en.wikisource.org/wiki/Eight_chapters_of_Maimonides_on_Ethics/Chapter_IV
  verified: 2026-11-22
- id: thoreau-frittered-away
  mentor: thoreau
  text: "Our life is frittered away by detail."
  work: Walden
  location: Chapter II, "Where I Lived, and What I Lived For"
  translation: null
  source_url: https://en.wikisource.org/wiki/Walden_(1893)_Thoreau/Chapter_II
  verified: 2026-11-22
- id: rumi-stream-renewed
  mentor: rumi
  text: "Life, like a stream of water, is renewed and renewed, Though it wears the appearance of continuity in form."
  work: Masnavi
  location: Book I
  translation: E. H. Whinfield (1898)
  source_url: https://en.wikisource.org/wiki/Masnavi_I_Ma'navi/Book_I
  verified: 2026-11-22
- id: marcus-pain-of-anger
  mentor: marcus-aurelius
  text: "consider how much more pain is brought on us by the anger and vexation caused by such acts than by the acts themselves, at which we are angry and vexed"
  work: Meditations
  location: Book XI, 18
  translation: George Long (1862)
  source_url: https://en.wikisource.org/wiki/The_Thoughts_of_the_Emperor_Marcus_Aurelius_Antoninus/Book_XI
  verified: 2026-11-22
- id: epictetus-notion-of-death
  mentor: epictetus
  text: "Men are disturbed, not by things, but by the principles and notions which they form concerning things. Death, for instance, is not terrible, else it would have appeared so to Socrates. But the terror consists in our notion of death that it is terrible."
  work: The Enchiridion
  location: Chapter 5
  translation: Elizabeth Carter (1758)
  source_url: https://classics.mit.edu/Epictetus/epicench.html
  verified: 2026-11-22
- id: emerson-every-end-a-beginning
  mentor: emerson
  text: "Our life is an apprenticeship to the truth, that around every circle another can be drawn; that there is no end in nature, but every end is a beginning"
  work: Circles
  location: Essays, First Series (1841)
  translation: null
  source_url: https://en.wikisource.org/wiki/Essays:_First_Series/Circles
  verified: 2026-11-22
- id: marcus-ten-thousand-years
  mentor: marcus-aurelius
  text: "Do not act as if thou wert going to live ten thousand years. Death hangs over thee. While thou livest, while it is in thy power, be good."
  work: Meditations
  location: Book IV, 17
  translation: George Long (1862)
  source_url: https://en.wikisource.org/wiki/The_Thoughts_of_the_Emperor_Marcus_Aurelius_Antoninus/Book_IV
  verified: 2026-11-23
- id: emerson-envy-is-ignorance
  mentor: emerson
  text: "There is a time in every man's education when he arrives at the conviction that envy is ignorance"
  work: Self-Reliance
  location: Essays, First Series (1841)
  translation: null
  source_url: https://en.wikisource.org/wiki/Essays:_First_Series/Self-Reliance
  verified: 2026-11-23
- id: chekhov-work-without-rest
  mentor: chekhov
  text: "we shall work for others without rest, both now and when we are old"
  work: Uncle Vanya
  location: Act IV (Sonia)
  translation: Marian Fell (1916)
  source_url: https://en.wikisource.org/wiki/Plays_by_Anton_Tchekoff_(Fell)/Uncle_Vanya/Act_4
  verified: 2026-11-23
- id: seneca-regards-himself-only
  mentor: seneca
  text: "He who regards himself only, and enters upon friendships for this reason, reckons wrongly."
  work: Moral Letters to Lucilius
  location: Letter 9
  translation: Richard Mott Gummere (1917)
  source_url: https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_9
  verified: 2026-11-23
- id: epictetus-in-our-control
  mentor: epictetus
  text: "Some things are in our control and others not."
  work: The Enchiridion
  location: Chapter 1
  translation: Elizabeth Carter (1758)
  source_url: https://classics.mit.edu/Epictetus/epicench.html
  verified: 2026-11-25
- id: buddha-call-nothing-our-own
  mentor: buddha
  text: "Let us live happily then, though we call nothing our own!"
  work: The Dhammapada
  location: Verse 200
  translation: F. Max Müller (1881)
  source_url: https://en.wikisource.org/wiki/Dhammapada_(Muller)
  verified: 2026-11-25
- id: tolstoy-most-necessary-man
  mentor: tolstoy
  text: "The most necessary man is he with whom you are, for no man knows whether he will ever have dealings with any one else: and the most important affair is, to do him good"
  work: Three Questions
  location: the closing paragraph
  translation: Louise and Aylmer Maude (1906)
  source_url: https://en.wikisource.org/wiki/Twenty-three_Tales/Three_Questions
  verified: 2026-11-25
- id: chekhov-only-philosophize
  mentor: chekhov
  text: "we only philosophize, we complain that we are dull, or we drink vodka."
  work: The Cherry Orchard
  location: Act II (Trofimov)
  translation: Julius West (1916)
  source_url: https://en.wikisource.org/wiki/The_Cherry_Orchard/Act_II
  verified: 2026-11-25
- id: marcus-made-for-cooperation
  mentor: marcus-aurelius
  text: "For we are made for co-operation, like feet, like hands, like eyelids, like the rows of the upper and lower teeth."
  work: Meditations
  location: Book II, 1
  translation: George Long (1862)
  source_url: https://en.wikisource.org/wiki/The_Thoughts_of_the_Emperor_Marcus_Aurelius_Antoninus/Book_II
  verified: 2026-11-27
- id: laotzu-no-resort-to-rage
  mentor: lao-tzu
  text: "He who in (Tao's) wars has skill Assumes no martial port; He who fights with most good will To rage makes no resort."
  work: Tao Te Ching
  location: Chapter 68
  translation: James Legge (1891)
  source_url: https://en.wikisource.org/wiki/Tâo_Teh_King
  verified: 2026-11-27
- id: socrates-heaping-up-honour
  mentor: socrates
  text: "are you not ashamed of heaping up the greatest amount of money and honour and reputation, and caring so little about wisdom and truth and the greatest improvement of the soul, which you never regard or heed at all?"
  work: Plato, Apology
  location: 29e
  translation: Benjamin Jowett (1871)
  source_url: https://en.wikisource.org/wiki/Apology_(Jowett)
  verified: 2026-11-27
